{{template "head" .}}
<div class="narrow">
  <h1>Sign in</h1>
  <p class="lead">Local administration for {{.Cfg.Deployment.Code}}.</p>
  <div class="card">
    <form method="post" action="/login" novalidate>
      <label for="username">User name</label>
      <input id="username" name="username" type="text" autocomplete="username" required value="{{index .Fields "username"}}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</div>
{{template "foot" .}}
