# Local development PostgreSQL for the Control Plane.
# Project name is prefixed `psacc-` so it never collides with other stacks on the same engine.
# Published on loopback only. Secrets come from infra/dev/.env (generated by `pnpm setup`, gitignored).
name: psacc-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: psacc-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm setup}
      POSTGRES_DB: postgres
      PSACC_OWNER_PASSWORD: ${PSACC_OWNER_PASSWORD:?run pnpm setup}
      PSACC_APP_PASSWORD: ${PSACC_APP_PASSWORD:?run pnpm setup}
      # Separate databases so dev data, API integration tests and browser E2E tests never interfere.
      PSACC_DATABASES: psacc_dev psacc_test psacc_e2e
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb

volumes:
  pgdata:
    name: psacc-dev-pgdata
